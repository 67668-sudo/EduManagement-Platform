services:
  mysql:
    image: mysql:8.0
    container_name: tlias-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: tlias
      TZ: Asia/Shanghai
    volumes:
      - ../sql:/docker-entrypoint-initdb.d   # 首次启动自动导入建表脚本
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tlias-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tlias?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
    ports:
      - "8080:8080"

  # 👇 注意看！nginx 必须和 app、mysql 对齐，都在 services 下面
  nginx:
    image: nginx:1.20.2
    container_name: tlias-nginx
    ports:
      - "80:80"                # 宿主机 90 → 容器 80，访问 http://localhost:90/login
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../frontend/dist:/usr/share/nginx/html   # 前端打包产物
    depends_on:
      - app

# 👇 volumes 是单独的一大块
volumes:
  mysql-data: