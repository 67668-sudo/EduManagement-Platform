user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 开启 gzip 压缩，加快前端页面加载速度（加分项）
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;

    server {
        listen       80;
        server_name  localhost;

        # 前端静态资源目录
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html; # 解决 Vue/React 刷新 404 问题
        }

        # 反向代理后端接口（前端直接请求 /login、/emps 等路径时走这里）
        location ~ ^/(login|depts|emps|clazzs|students|report|upload|log)(/|$) {
            proxy_pass http://app:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 反向代理后端接口（前端请求带 /api 前缀时走这里）
        location /api/ {
            # 👈 注意这里的 app 必须和你 docker-compose.yml 里的 Java 服务名一模一样！
            proxy_pass http://app:8080/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}