spring:
  application:
    name: tlias-web-management
  datasource:
    # 👈 本地开发时用 localhost。Docker 部署时会自动被环境变量覆盖为 mysql
    url: jdbc:mysql://localhost:3306/tlias?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456 # 👈 这里的密码，Docker 部署时也会被环境变量覆盖
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket-name: java-ai-web-final
    region: cn-beijing